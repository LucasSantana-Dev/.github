name: Claude Code Review (reusable)

# Reusable workflow that runs the Claude PR reviewer aligned with the
# merge rule in https://github.com/LucasSantana-Dev/.claude/standards/workflow.md.
#
# Reviews are on demand: callers trigger on a `/claude-review` PR comment, and
# this workflow caps each PR at `max_reviews` runs (default 3). Caller:
#
#   on:
#     issue_comment:
#       types: [created]
#   permissions:
#     contents: read
#     pull-requests: write
#     issues: write
#     id-token: write
#   jobs:
#     review:
#       if: >-
#         ${{ github.event.issue.pull_request
#         && startsWith(github.event.comment.body, '/claude-review')
#         && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) }}
#       uses: LucasSantana-Dev/.github/.github/workflows/claude-review.yml@<sha>
#       secrets:
#         CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
#
# Pass CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`, bills the Claude
# subscription) or ANTHROPIC_API_KEY (bills API credits). One is required.
#
# Security: issue_comment runs with repo secrets and this workflow checks out
# the PR head, so fork PRs are refused and only OWNER/MEMBER/COLLABORATOR
# comments may trigger it (checked here too, not only in the caller).

on:
  workflow_call:
    inputs:
      pr_number:
        description: 'PR to review. Defaults to the triggering PR or PR comment.'
        type: number
        required: false
        default: 0
      max_reviews:
        description: 'Max review runs per PR. Default 3.'
        type: number
        required: false
        default: 3
      model:
        description: 'Anthropic model id. Default sonnet.'
        type: string
        required: false
        default: 'claude-sonnet-4-6'
      max_turns:
        description: 'Max agent turns. Reading the diff and posting needs ~15.'
        type: number
        required: false
        default: 20
      timeout_minutes:
        description: 'Job timeout in minutes.'
        type: number
        required: false
        default: 15
      prompt_override:
        description: |
          Optional repo-specific prompt addendum. The base prompt enforces
          the merge rule; if provided, this string is appended after the
          base instructions.
        type: string
        required: false
        default: ''
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    concurrency:
      group: claude-review-${{ inputs.pr_number || github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ inputs.pr_number || github.event.pull_request.number || github.event.issue.number }}
      MAX_REVIEWS: ${{ inputs.max_reviews }}
      MARKER: '<!-- claude-review-run -->'
    steps:
      - name: Require a Claude credential
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [ "$HAS_KEY" != true ] && [ "$HAS_OAUTH" != true ]; then
            echo "::error::Pass CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY to claude-review.yml"
            exit 1
          fi

      - name: Check trigger, PR and review budget
        id: gate
        env:
          ASSOC: ${{ github.event.comment.author_association }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          if [ -z "$PR" ] || [ "$PR" = 0 ]; then
            echo "::error::No PR number (pass pr_number or trigger from a PR comment)"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = issue_comment ]; then
            case "$ASSOC" in
              OWNER|MEMBER|COLLABORATOR) ;;
              *) echo "::error::Comment author association '$ASSOC' may not trigger a review"; exit 1 ;;
            esac
          fi

          info=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json state,isDraft,isCrossRepository,baseRefName,headRefOid)
          if [ "$(jq -r .isCrossRepository <<<"$info")" = true ]; then
            echo "::error::Fork PRs are not reviewed (this job has secrets and checks out the PR head)"
            exit 1
          fi
          state=$(jq -r .state <<<"$info")
          if [ "$state" != OPEN ] || [ "$(jq -r .isDraft <<<"$info")" = true ]; then
            echo "::notice::PR #$PR is $state or draft; not reviewing"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          used=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$MARKER\")))] | length" \
            | awk '{s += $1} END {print s + 0}')
          if [ "$used" -ge "$MAX_REVIEWS" ]; then
            gh pr comment "$PR" -R "$GITHUB_REPOSITORY" \
              --body "Claude review limit reached for this PR ($used/$MAX_REVIEWS runs). Not running."
            echo "::notice::Review budget used ($used/$MAX_REVIEWS)"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          head_sha=$(jq -r .headRefOid <<<"$info")
          gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body "$MARKER
          Claude review $((used + 1))/$MAX_REVIEWS requested by @$ACTOR on \`${head_sha:0:7}\`."
          {
            echo "run=true"
            echo "base=$(jq -r .baseRefName <<<"$info")"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout PR head
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ env.PR }}/head
          fetch-depth: 0

      - name: Run Claude PR review
        id: claude
        if: steps.gate.outputs.run == 'true'
        uses: anthropics/claude-code-action@af0559ee4f514d1ef21826982bed13f7edc3c35e # v1.0.178
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Use the job token instead of the Claude GitHub App OIDC exchange. The
          # exchange "skips" (green job, no review) when the caller workflow is
          # not yet on the default branch, which hides a review that never ran.
          github_token: ${{ github.token }}
          # claude-code-action@v1 dropped the `model` / `max_turns` inputs and
          # renamed `direct_prompt` → `prompt`; model/turns now fold into
          # `claude_args` (passed through to the Claude CLI). The old inputs were
          # silently ignored, so the configured model/turns never applied.
          # With a custom prompt the action grants no GitHub write tools, so
          # posting needs an explicit allowlist (else: green run, no review).
          claude_args: |
            --model ${{ inputs.model }} --max-turns ${{ inputs.max_turns }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          prompt: |
            Review pull request #${{ env.PR }} in ${{ github.repository }} against `${{ steps.gate.outputs.base }}`.
            The PR head is checked out in the working directory. Use `gh pr diff ${{ env.PR }}`
            and `gh pr view ${{ env.PR }}` to see the change.

            **What to flag (substantive only):**
            - Correctness bugs (logic errors, dead code paths, broken control flow)
            - Security risks (auth bypass, injection, leaked secrets, unsafe deserialization)
            - Semver hazards (peer-dep mismatches, range lag against companion packages)
            - Production-risk version picks (non-LTS images on release branches, freshly-cut "Current" lines)
            - Test gaps that would let real regressions slip through (NOT coverage % targets)
            - Race conditions, retry logic that doesn't fire, error handlers that swallow real failures

            **What to SKIP:**
            - Style preferences (formatting, naming, ordering)
            - "Could be more idiomatic" suggestions
            - Documentation completeness unless the docs are actively misleading
            - Minor / Nitpick / Optional / Quick-win observations
            - Anything you would tag with 💤 Low value

            **Format (required, the job fails if nothing is posted):**
            - For each substantive issue, post an inline comment with
              `mcp__github_inline_comment__create_inline_comment` and a concrete fix.
            - Always finish with exactly one summary via
              `gh pr comment ${{ env.PR }} --body "..."` whose body starts with
              "Claude review:". With no substantive issues it is
              "Claude review: no substantive concerns".
            - Do not push commits.

            Read `.claude/standards/workflow.md` "Merge rule" section in the checked-out
            tree (if present) for repo-specific guidance.

            ${{ inputs.prompt_override }}

      - name: Fail if the review was skipped
        if: ${{ steps.claude.outputs.skipped_due_to_workflow_validation_mismatch == 'true' }}
        run: |
          echo "::error::claude-code-action skipped the review (workflow validation mismatch); no review was posted"
          exit 1

      - name: Fail if no review was posted
        if: steps.gate.outputs.run == 'true'
        env:
          SINCE: ${{ steps.gate.outputs.started_at }}
        run: |
          set -euo pipefail
          summaries=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments?since=$SINCE" \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("Claude review:")))] | length' \
            | awk '{s += $1} END {print s + 0}')
          if [ "$summaries" -lt 1 ]; then
            echo "::error::Claude finished but posted no 'Claude review:' summary on PR #$PR"
            exit 1
          fi
          echo "Posted $summaries summary comment(s)."
